- name: Collect BGP and OVN diagnostic data before teardown
  hosts: compute
  become: true
  ignore_unreachable: true
  tasks:
    - name: Ensure /var/log/openvswitch directory exists
      ansible.builtin.file:
        path: /var/log/openvswitch
        state: directory
        mode: '0755'
      ignore_errors: true

    - name: Dump OVS configuration
      ansible.builtin.command: ovs-vsctl show
      register: ovs_vsctl
      ignore_errors: true

    - name: Save OVS configuration
      ansible.builtin.copy:
        content: "{{ ovs_vsctl.stdout | default(ovs_vsctl.stderr | default('command failed')) }}"
        dest: /var/log/openvswitch/ovs-vsctl-show-dump.txt
        mode: '0644'
      when: ovs_vsctl is not skipped
      ignore_errors: true

    - name: Dump FRR BGP state
      ansible.builtin.shell: |
        vtysh -c "show bgp summary" 2>&1
        vtysh -c "show bfd peers" 2>&1
        {% if enable_evpn | default(false) %}
        vtysh -c "show bgp l2vpn evpn" 2>&1
        vtysh -c "show bgp l2vpn evpn summary" 2>&1
        vtysh -c "show evpn vni" 2>&1
        {% endif %}
      register: frr_state
      ignore_errors: true

    - name: Save FRR BGP state
      ansible.builtin.copy:
        content: "{{ frr_state.stdout | default(frr_state.stderr | default('command failed')) }}"
        dest: /var/log/frr/bgp_state.txt
        mode: '0644'
      when: frr_state is not skipped
      ignore_errors: true

    - name: Collect EVPN-specific diagnostics
      when: enable_evpn | default(false)
      block:
        - name: Dump EVPN-related interfaces
          ansible.builtin.shell: |
            ip link show type vxlan 2>&1
            ip link show type bridge 2>&1
            ip link show type vrf 2>&1
          register: evpn_interfaces
          ignore_errors: true

        - name: Save EVPN-related interfaces
          ansible.builtin.copy:
            content: "{{ evpn_interfaces.stdout | default(evpn_interfaces.stderr | default('command failed')) }}"
            dest: /var/log/openvswitch/evpn_interfaces.txt
            mode: '0644'
          when: evpn_interfaces is not skipped
          ignore_errors: true

- name: Collect diagnostics from spine and leafs
  hosts: spine,leafs
  become: true
  ignore_unreachable: true
  tasks:
    - name: Dump FRR BGP state
      ansible.builtin.shell: |
        vtysh -c "show bgp summary" 2>&1
        vtysh -c "show bfd peers" 2>&1
        {% if enable_evpn | default(false) %}
        vtysh -c "show bgp l2vpn evpn" 2>&1
        vtysh -c "show bgp l2vpn evpn summary" 2>&1
        {% endif %}
      register: frr_state
      ignore_errors: true

    - name: Save FRR BGP state
      ansible.builtin.copy:
        content: "{{ frr_state.stdout | default(frr_state.stderr | default('command failed')) }}"
        dest: /var/log/frr/bgp_state.txt
        mode: '0644'
      when: frr_state is not skipped
      ignore_errors: true
